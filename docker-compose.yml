services:
  db:
    image: pgvector/pgvector:pg16
    container_name: portal-cidadao-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal_cidadao
      POSTGRES_USER: portal_user
      POSTGRES_PASSWORD: 12345678
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: